<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f3f0e9" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#151513"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <!-- browser -->
  <g transform="translate(110 90)">
    <rect width="1380" height="910" fill="#e9e5dc"/>
    <rect width="1380" height="48" fill="#d8d3c8"/>
    <circle cx="26" cy="24" r="7" fill="#ff4d2e"/><circle cx="50" cy="24" r="7" fill="#b9b3a7"/><circle cx="74" cy="24" r="7" fill="#b9b3a7"/>
    <rect x="470" y="12" width="440" height="24" rx="12" fill="#efebe3"/>
    <text x="690" y="29" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6f6b63" text-anchor="middle">kothisteel.example</text>
    <!-- nav -->
    <rect x="0" y="48" width="1380" height="70" fill="#f3f0e9"/>
    <rect x="50" y="70" width="26" height="26" fill="#ff4d2e"/>
    <text x="90" y="92" font-family="Impact, 'Arial Narrow', sans-serif" font-size="26" fill="#111" letter-spacing="1">KOTHI STEEL</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#3b3a36" letter-spacing="1.5">
      <text x="820" y="89">PRODUCTS</text><text x="930" y="89">INDUSTRIES</text><text x="1055" y="89">ABOUT</text>
    </g>
    <rect x="1170" y="66" width="170" height="34" fill="#111"/>
    <text x="1255" y="88" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#f3f0e9" text-anchor="middle" letter-spacing="1.5">SEND ENQUIRY</text>
    <!-- hero -->
    <text x="50" y="250" font-family="Impact, 'Arial Narrow', sans-serif" font-size="108" fill="#111">STEEL, BUILT</text>
    <text x="50" y="360" font-family="Impact, 'Arial Narrow', sans-serif" font-size="108" fill="#ff4d2e">TO SPEC.</text>
    <rect x="50" y="395" width="420" height="10" fill="#c9c3b7"/>
    <rect x="50" y="418" width="340" height="10" fill="#c9c3b7"/>
    <rect x="50" y="460" width="190" height="44" fill="#ff4d2e"/>
    <text x="145" y="488" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#111" text-anchor="middle" letter-spacing="1.5">BROWSE RANGE</text>
    <!-- hero visual: stacked I-beams -->
    <g transform="translate(760 150)">
      <rect width="570" height="360" fill="#1a1a18"/>
      <g fill="#3a3935" stroke="#55534d" stroke-width="2">
        <path d="M40 300h220v18H40zM140 318h20v-0zM40 230h220v18H40z"/>
        <path d="M60 248h180v52H60z" fill="#2a2926"/>
        <path d="M290 300h240v18H290zM290 230h240v18H290z"/>
        <path d="M310 248h200v52H310z" fill="#2a2926"/>
        <path d="M160 160h240v18H160zM160 90h240v18H160z"/>
        <path d="M180 108h200v52H180z" fill="#2a2926"/>
      </g>
      <line x1="0" y1="340" x2="570" y2="340" stroke="#ff4d2e" stroke-width="3"/>
      <text x="20" y="34" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#a39e94" letter-spacing="2">ISMB 200 · IS 2062</text>
    </g>
    <!-- product grid -->
    <text x="50" y="590" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6f6b63" letter-spacing="2">PRODUCT RANGE — 04 CATEGORIES</text>
    <line x1="50" y1="605" x2="1330" y2="605" stroke="#c9c3b7"/>
    <g font-family="Impact, 'Arial Narrow', sans-serif" font-size="30" fill="#111">
      <g transform="translate(50 630)">
        <rect width="305" height="230" fill="#f3f0e9" stroke="#d1cbbf"/>
        <path d="M70 60h160v14H70zM70 136h160v14H70zM140 74h20v62h-20z" fill="#2a2926"/>
        <text x="20" y="205">BEAMS</text>
      </g>
      <g transform="translate(375 630)">
        <rect width="305" height="230" fill="#f3f0e9" stroke="#d1cbbf"/>
        <circle cx="152" cy="100" r="54" fill="none" stroke="#2a2926" stroke-width="14"/>
        <text x="20" y="205">PIPES</text>
      </g>
      <g transform="translate(700 630)">
        <rect width="305" height="230" fill="#f3f0e9" stroke="#d1cbbf"/>
        <path d="M100 40h18v110h80v18H100z" fill="#2a2926"/>
        <text x="20" y="205">ANGLES</text>
      </g>
      <g transform="translate(1025 630)">
        <rect width="305" height="230" fill="#ff4d2e"/>
        <path d="M60 120l120-50 70 30-120 50z" fill="#111" opacity=".85"/>
        <path d="M60 135l120-50 70 30-120 50z" fill="none" stroke="#111" stroke-width="2"/>
        <text x="20" y="205">SHEETS</text>
      </g>
    </g>
  </g>
</svg>

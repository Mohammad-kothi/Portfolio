<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="1600" height="1000" fill="#ff4d2e"/>
  <g transform="translate(110 90)">
    <rect width="1380" height="910" fill="#0f1114"/>
    <rect width="1380" height="48" fill="#1c1f24"/>
    <circle cx="26" cy="24" r="7" fill="#ff4d2e"/><circle cx="50" cy="24" r="7" fill="#3a3e45"/><circle cx="74" cy="24" r="7" fill="#3a3e45"/>
    <rect x="470" y="12" width="440" height="24" rx="12" fill="#262a30"/>
    <text x="690" y="29" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#8a9099" text-anchor="middle">ridgeline-roofing.example</text>
    <!-- sky + roofs -->
    <rect x="0" y="48" width="1380" height="560" fill="#16191e"/>
    <g fill="none" stroke-linejoin="miter">
      <polyline points="0,520 240,340 480,520" stroke="#2b3038" stroke-width="40"/>
      <polyline points="380,560 700,300 1020,560" stroke="#353b44" stroke-width="40"/>
      <polyline points="900,540 1160,360 1420,540" stroke="#2b3038" stroke-width="40"/>
      <polyline points="380,560 700,300 1020,560" stroke="#ff4d2e" stroke-width="4" transform="translate(0 -32)"/>
    </g>
    <rect x="0" y="560" width="1380" height="48" fill="#0f1114"/>
    <!-- nav -->
    <text x="50" y="104" font-family="Impact, 'Arial Narrow', sans-serif" font-size="28" fill="#f3f0e9" letter-spacing="2">RIDGELINE</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#b8bdc4" letter-spacing="1.5">
      <text x="860" y="100">SERVICES</text><text x="970" y="100">PROJECTS</text><text x="1080" y="100">REVIEWS</text>
    </g>
    <rect x="1190" y="76" width="150" height="38" fill="#ff4d2e"/>
    <text x="1265" y="100" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0f1114" text-anchor="middle" letter-spacing="1.5">CALL NOW</text>
    <!-- headline -->
    <text x="50" y="230" font-family="Impact, 'Arial Narrow', sans-serif" font-size="92" fill="#f3f0e9">ROOFS THAT</text>
    <text x="50" y="325" font-family="Impact, 'Arial Narrow', sans-serif" font-size="92" fill="#f3f0e9">OUTLAST THE STORM.</text>
    <rect x="50" y="360" width="230" height="48" fill="#ff4d2e"/>
    <text x="165" y="390" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0f1114" text-anchor="middle" letter-spacing="1.5">FREE INSPECTION</text>
    <rect x="296" y="360" width="190" height="48" fill="none" stroke="#f3f0e9"/>
    <text x="391" y="390" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f3f0e9" text-anchor="middle" letter-spacing="1.5">OUR WORK</text>
    <!-- services -->
    <g font-family="ui-monospace, Menlo, monospace">
      <g transform="translate(50 650)">
        <rect width="410" height="210" fill="#16191e" stroke="#2b3038"/>
        <text x="28" y="48" font-size="13" fill="#ff4d2e" letter-spacing="2">01</text>
        <text x="28" y="110" font-family="Impact, 'Arial Narrow', sans-serif" font-size="40" fill="#f3f0e9">REPLACEMENT</text>
        <rect x="28" y="140" width="300" height="9" fill="#2b3038"/><rect x="28" y="160" width="240" height="9" fill="#2b3038"/>
      </g>
      <g transform="translate(485 650)">
        <rect width="410" height="210" fill="#16191e" stroke="#2b3038"/>
        <text x="28" y="48" font-size="13" fill="#ff4d2e" letter-spacing="2">02</text>
        <text x="28" y="110" font-family="Impact, 'Arial Narrow', sans-serif" font-size="40" fill="#f3f0e9">STORM REPAIR</text>
        <rect x="28" y="140" width="300" height="9" fill="#2b3038"/><rect x="28" y="160" width="220" height="9" fill="#2b3038"/>
      </g>
      <g transform="translate(920 650)">
        <rect width="410" height="210" fill="#16191e" stroke="#2b3038"/>
        <text x="28" y="48" font-size="13" fill="#ff4d2e" letter-spacing="2">03</text>
        <text x="28" y="110" font-family="Impact, 'Arial Narrow', sans-serif" font-size="40" fill="#f3f0e9">GUTTERS</text>
        <rect x="28" y="140" width="300" height="9" fill="#2b3038"/><rect x="28" y="160" width="260" height="9" fill="#2b3038"/>
      </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f3f0e9" fill-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#1a1a17"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="22">
    <!-- editor -->
    <g transform="translate(110 110)">
      <rect width="860" height="780" fill="#0b0b0a" stroke="#2a2925"/>
      <rect width="860" height="46" fill="#141412"/>
      <circle cx="24" cy="23" r="7" fill="#ff4d2e"/><circle cx="48" cy="23" r="7" fill="#3a3935"/><circle cx="72" cy="23" r="7" fill="#3a3935"/>
      <text x="110" y="30" font-size="15" fill="#a39e94">week_03/two_sum.py</text>
      <g fill="#5a5750" text-anchor="end" font-size="18">
        <text x="56" y="108">1</text><text x="56" y="146">2</text><text x="56" y="184">3</text><text x="56" y="222">4</text><text x="56" y="260">5</text><text x="56" y="298">6</text><text x="56" y="336">7</text><text x="56" y="374">8</text><text x="56" y="412">9</text><text x="56" y="450">10</text><text x="56" y="488">11</text><text x="56" y="526">12</text><text x="56" y="564">13</text>
      </g>
      <text x="80" y="108"><tspan fill="#ff7a5c">def</tspan><tspan fill="#f3f0e9"> two_sum(nums, target):</tspan></text>
      <text x="80" y="146" fill="#7d786f">    # one pass, O(n)</text>
      <text x="80" y="184" fill="#f3f0e9">    seen = {}</text>
      <text x="80" y="222"><tspan fill="#ff7a5c">    for</tspan><tspan fill="#f3f0e9"> i, n </tspan><tspan fill="#ff7a5c">in</tspan><tspan fill="#f3f0e9"> enumerate(nums):</tspan></text>
      <text x="80" y="260" fill="#f3f0e9">        need = target - n</text>
      <text x="80" y="298"><tspan fill="#ff7a5c">        if</tspan><tspan fill="#f3f0e9"> need </tspan><tspan fill="#ff7a5c">in</tspan><tspan fill="#f3f0e9"> seen:</tspan></text>
      <text x="80" y="336"><tspan fill="#ff7a5c">            return</tspan><tspan fill="#f3f0e9"> [seen[need], i]</tspan></text>
      <text x="80" y="374" fill="#f3f0e9">        seen[n] = i</text>
      <text x="80" y="412"><tspan fill="#ff7a5c">    return</tspan><tspan fill="#f3f0e9"> []</tspan></text>
      <text x="80" y="488" fill="#7d786f"># tests</text>
      <text x="80" y="526"><tspan fill="#ff7a5c">assert</tspan><tspan fill="#f3f0e9"> two_sum([2, 7, 11, 15], 9) == [0, 1]</tspan></text>
      <rect x="80" y="545" width="12" height="26" fill="#ff4d2e"/>
      <rect x="0" y="734" width="860" height="46" fill="#141412"/>
      <text x="24" y="764" font-size="15" fill="#a39e94">Python 3.12 · UTF-8 · LF</text>
      <text x="836" y="764" font-size="15" fill="#ff4d2e" text-anchor="end">● main</text>
    </g>
    <!-- terminal -->
    <g transform="translate(1000 230)">
      <rect width="490" height="660" fill="#0b0b0a" stroke="#ff4d2e"/>
      <rect width="490" height="46" fill="#ff4d2e"/>
      <text x="22" y="30" font-size="15" fill="#0b0b0a" letter-spacing="2">TERMINAL — git log</text>
      <g font-size="17">
        <text x="22" y="96" fill="#ff7a5c">$ <tspan fill="#f3f0e9">git log --oneline</tspan></text>
        <text x="22" y="136" fill="#ff4d2e">a3f9c1e <tspan fill="#f3f0e9">two sum: hash map</tspan></text>
        <text x="22" y="170" fill="#ff4d2e">91be07d <tspan fill="#f3f0e9">add tests</tspan></text>
        <text x="22" y="204" fill="#ff4d2e">5d2e4aa <tspan fill="#f3f0e9">week 3: lists</tspan></text>
        <text x="22" y="238" fill="#ff4d2e">c08f113 <tspan fill="#f3f0e9">merge branch loops</tspan></text>
        <text x="22" y="272" fill="#ff4d2e">7e61b9a <tspan fill="#f3f0e9">first commit</tspan></text>
        <text x="22" y="330" fill="#ff7a5c">$ <tspan fill="#f3f0e9">python -m pytest</tspan></text>
        <text x="22" y="370" fill="#a39e94">collected 12 items</text>
        <text x="22" y="404" fill="#f3f0e9">............ <tspan fill="#ff4d2e">12 passed</tspan></text>
        <text x="22" y="462" fill="#ff7a5c">$ <tspan fill="#f3f0e9">git push origin main</tspan></text>
        <rect x="22" y="484" width="11" height="22" fill="#f3f0e9"/>
      </g>
    </g>
  </g>
</svg>
